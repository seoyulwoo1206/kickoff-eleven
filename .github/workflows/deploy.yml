# main에 올리면 빌드해서 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions"로 한 번 설정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 서비스 워커 캐시 이름을 커밋 해시로 바꿔 배포마다 옛 캐시가 지워지게 한다
      - name: Stamp service worker cache name
        run: sed -i "s/ko11-v[0-9A-Za-z]*/ko11-v${GITHUB_SHA::8}/" public/sw.js
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
